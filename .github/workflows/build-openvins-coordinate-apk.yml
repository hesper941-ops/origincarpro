name: Build OpenVINS Coordinate APK

on:
  push:
    branches: [ openvins-coordinate-test ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout wrapper repo
        uses: actions/checkout@v4
        with:
          path: wrapper

      - name: Checkout OpenVINS Mobile
        uses: actions/checkout@v4
        with:
          repository: goldbattle/open_vins_mobile
          ref: restructure
          submodules: recursive
          fetch-depth: 1
          path: openvins

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android native toolchain
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-30" "build-tools;30.0.3" "cmake;3.18.1" "ndk;26.1.10909125"

      - name: Patch for Xiaomi Pad 7S Pro coordinate recording
        working-directory: openvins
        run: |
          python3 ../wrapper/openvins_xiaomi7s_patch.py
          chmod +x gradlew

      - name: Build debug APK
        working-directory: openvins
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Collect APK
        run: |
          mkdir -p out
          cp openvins/app/build/outputs/apk/debug/app-debug.apk out/VIO-Coordinate-Xiaomi7SPro-debug.apk
          sha256sum out/VIO-Coordinate-Xiaomi7SPro-debug.apk | tee out/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VIO-Coordinate-Xiaomi7SPro-debug-apk
          path: out/*
          if-no-files-found: error
