name: Build OpenVINS Coordinate APK

on:
  push:
    branches: [ openvins-coordinate-test ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout OpenVINS Mobile
        uses: actions/checkout@v4
        with:
          repository: goldbattle/open_vins_mobile
          ref: restructure
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android native toolchain
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-30" \
            "build-tools;30.0.3" \
            "cmake;3.18.1" \
            "ndk;26.1.10909125"

      - name: Patch CI build for Xiaomi Pad 7S Pro
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle')
          s = p.read_text()
          s = s.replace("abiFilters 'x86', 'x86_64', 'arm64-v8a' // 'armeabi-v7a',", "abiFilters 'arm64-v8a'")
          s = s.replace("task syncDeviceFiles {\n", "task syncDeviceFiles {\n    onlyIf { System.getenv('CI') != 'true' }\n")
          p.write_text(s)
          PY
          chmod +x gradlew

      - name: Build debug APK
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/OpenVINS-Xiaomi7SPro-debug.apk
          sha256sum out/OpenVINS-Xiaomi7SPro-debug.apk | tee out/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenVINS-Xiaomi7SPro-debug-apk
          path: out/*
          if-no-files-found: error
