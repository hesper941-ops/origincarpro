name: Build AV-Twin Android APK

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'avtwin_android_build/**'
      - '.github/workflows/build-avtwin-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Run unit tests
        run: gradle -p avtwin_android_build :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle -p avtwin_android_build :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp avtwin_android_build/app/build/outputs/apk/debug/app-debug.apk AVTwinAndroidResponder-v0.8.2-strict-arm-debug.apk

      - name: Package source
        run: |
          rm -rf avtwin_android_build/app/build avtwin_android_build/.gradle
          printf 'AV-Twin Android Continuous Acoustic Responder\nVersion: 0.8.2 STRICT ARM\nSource commit: %s\n' "$GITHUB_SHA" > SOURCE_EXPORT_INFO.txt
          zip -r AVTwinAndroidResponder-v0.8.2-strict-arm-source.zip avtwin_android_build SOURCE_EXPORT_INFO.txt .github/workflows/build-avtwin-apk.yml

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AVTwinAndroidResponder-v0.8.2-strict-arm-debug-apk
          path: AVTwinAndroidResponder-v0.8.2-strict-arm-debug.apk
          if-no-files-found: error

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AVTwinAndroidResponder-v0.8.2-strict-arm-source
          path: AVTwinAndroidResponder-v0.8.2-strict-arm-source.zip
          if-no-files-found: error
