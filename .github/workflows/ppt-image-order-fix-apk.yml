name: Build PPT Image Order Fix APK

on:
  push:
    branches:
      - temp-ppt-apk-build-20260903
    paths:
      - 'ppt-image-order-fix/**'
      - '.github/workflows/ppt-image-order-fix-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ppt-image-order-fix
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PPTImageOrderFix-debug-apk
          path: ppt-image-order-fix/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
