perspective_node:
  ros__parameters:
    # 默认使用统一相机入口，不直接订阅 /aurora/rgb/image_raw
    input_topic: /image_out
    output_topic: /bird_view/image
    compressed_output_topic: /bird_view/image/compressed

    image_width: 640
    image_height: 480

    src_points:
      - 257.0
      - 391.0
      - 315.0
      - 395.0
      - 307.0
      - 277.0
      - 278.0
      - 275.0

    dst_points:
      - 0.0
      - 480.0
      - 640.0
      - 480.0
      - 640.0
      - 0.0
      - 0.0
      - 0.0

    pixel_per_meter: 200.0
    publish_compressed: true
    show_window: false
