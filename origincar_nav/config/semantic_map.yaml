# Coordinates use the 5m x 5m official field convention:
# origin at the lower-left corner, x to the right, y upward, units in meters.
# Current point values are approximate from the rule map and must be tuned
# on the real car with /odom_combined before competition use.
map_frame: map
odom_frame: odom_combined
base_frame: base_footprint

task_manager:
  qr_scan_start_dist_to_task_station: 1.0

visualization:
  frame_id: map
  path_max_length: 500
  show_text_labels: true
  show_routes: true
  show_boundary: true

yolo_labels:
  qr: QR_code
  line: line
  p_point: end
  obstacle: roadblock

boundary:
  x_min: 0.0
  x_max: 5.0
  y_min: 0.0
  y_max: 5.0

points:
  p_start:
    # Approximate rule-map coordinate; calibrate on car.
    pose: [0.33, 0.23, 0.0]
    description: "P point / start point"

  task_station:
    # Approximate rule-map coordinate; calibrate on car.
    pose: [4.72, 1.55, 0.0]
    description: "QR task publishing station"

  channel_entry:
    # Compatibility field for current task_manager; prefer channel_entry_lower / channel_entry_upper later.
    # Approximate rule-map coordinate; calibrate on car.
    pose: [2.50, 2.30, 0.0]
    description: "Compatibility entrance point, currently equal to channel_entry_lower"

  channel_entry_lower:
    # Approximate rule-map coordinate; calibrate on car.
    pose: [2.50, 2.30, 0.0]
    description: "Lower entrance from blue hall to vertical yellow channel"

  channel_entry_upper:
    # Approximate rule-map coordinate; calibrate on car.
    pose: [2.50, 3.25, 0.0]
    description: "Upper transition from vertical entrance channel to yellow loop"

  channel_p1:
    # Approximate rule-map coordinate; calibrate on car.
    pose: [1.12, 3.25, 0.0]

  channel_p2:
    # Approximate rule-map coordinate; calibrate on car.
    pose: [3.88, 3.25, 1.57]

  channel_p3:
    # Approximate rule-map coordinate; calibrate on car.
    pose: [3.88, 4.18, 3.14]

  channel_p4:
    # Approximate rule-map coordinate; calibrate on car.
    pose: [1.12, 4.18, -1.57]

routes:
  clockwise:
    channel_order: [channel_p1, channel_p2, channel_p3, channel_p4]

  anticlockwise:
    channel_order: [channel_p1, channel_p4, channel_p3, channel_p2]

thresholds:
  goal_reached_dist: 0.15
  goal_reached_yaw: 0.35
  channel_goal_reached_dist: 0.12
