map_frame: map
odom_frame: odom_combined
base_frame: base_footprint
task_manager:
  qr_scan_start_dist_to_task_station: 1.0
visualization:
  frame_id: map
  path_max_length: 500
  show_text_labels: true
  show_routes: true
  show_boundary: true
yolo_labels:
  qr: QR_code
  line: line
  p_point: end
  obstacle: roadblock
boundary:
  x_min: 0.0
  x_max: 5.0
  y_min: 0.0
  y_max: 5.0
points:
  p_start:
    pose:
    - 0.0
    - 0.0
    - 0.0
    description: P point / start point
  task_station:
    pose:
    - 4.2
    - 1.6
    - 0.0
    description: QR task publishing station
  channel_entry:
    pose:
    - 1.95
    - 1.8
    - 0.0
    description: Compatibility entrance point, currently equal to channel_entry_lower
  channel_entry_lower:
    pose:
    - 1.95
    - 1.8
    - 0.0
    description: Lower entrance from blue hall to vertical yellow channel
  channel_entry_upper:
    pose:
    - 1.95
    - 2.97
    - 0.0
    description: Upper transition from vertical entrance channel to yellow loop
  channel_p1:
    pose:
    - 0.2
    - 2.97
    - 0.0
  channel_p2:
    pose:
    - 3.7
    - 2.97
    - 0.0
  channel_p3:
    pose:
    - 3.7
    - 4.12
    - 0.0
  channel_p4:
    pose:
    - 0.2
    - 4.12
    - 0.0
routes:
  clockwise:
    channel_order:
    - channel_p1
    - channel_p2
    - channel_p3
    - channel_p4
  anticlockwise:
    channel_order:
    - channel_p1
    - channel_p4
    - channel_p3
    - channel_p2
thresholds:
  goal_reached_dist: 0.15
  goal_reached_yaw: 0.35
  channel_goal_reached_dist: 0.12
