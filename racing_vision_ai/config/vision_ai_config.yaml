# Vision AI Configuration File
# 火山引擎配置
volcengine:
  # API密钥 - 请替换为你的实际API密钥
  #9d3d0938-5900-4a1e-bf74-a996e7855a69    2408ba18-3415-4c6e-9f50-1678ee928e5b 
  api_key: ""
  
  # 模型ID - 请替换为你要使用的模型ID
  #doubao-seed-1-6-250615   deepseek-r1-250528
  model_id: "doubao-seed-1-6-250615"
  
  # AI分析提示词
  prompt: "请高效描述这张以机器人开发为背景的图片的信息，陈述在100字以内"

# 检测配置
detection:
  # 触发图像分析的sign值
  target_sign: 9
  
  # 图像话题名称
  image_topic: "/image"
  
  # sign话题名称  
  sign_topic: "sign4return"

# 图像处理配置
image:
  # 图像质量 (1-100)
  jpeg_quality: 85
  
  # 图像格式
  format: "JPEG"
